<script>
  (function() {
    let pin = '';
    const maxPinLength = 4;
    const pinDots = document.querySelectorAll('.pin-dot');
    const keypadButtons = document.querySelectorAll('.numpad-key');
    const backspaceBtn = document.getElementById('numpadBackspace');
    const clearBtn = document.getElementById('numpadClear');
    const initialCashInput = document.getElementById('initialCash');
    const presetPills = document.querySelectorAll('.preset-pill');
    const clearCashBtn = document.getElementById('clearCash');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const pinDotsWrapper = document.getElementById('pinDotsWrapper');
    const keypadGrid = document.getElementById('keypadGrid');
    const passwordFieldWrapper = document.getElementById('passwordFieldWrapper');
    const cashierCards = document.querySelectorAll('.cashier-card');
    const submitBtn = document.getElementById('submitOpenRegister');

    function updateDots() {
      pinDots.forEach((dot, index) => {
        if (index < pin.length) {
          dot.classList.remove('bg-surface-container-highest');
          dot.classList.add('bg-primary-container');
        } else {
          dot.classList.remove('bg-primary-container');
          dot.classList.add('bg-surface-container-highest');
        }
      });
    }

    keypadButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (pin.length < maxPinLength) {
          pin += btn.innerText.trim();
          updateDots();
        }
      });
    });

    backspaceBtn.addEventListener('click', () => {
      if (pin.length > 0) {
        pin = pin.slice(0, -1);
        updateDots();
      }
    });

    clearBtn.addEventListener('click', () => {
      pin = '';
      updateDots();
    });

    presetPills.forEach(pill => {
      pill.addEventListener('click', () => {
        let current = parseFloat(initialCashInput.value.replace(/,/g, '')) || 0;
        let add = parseFloat(pill.getAttribute('data-amt')) || 0;
        let total = current + add;
        initialCashInput.value = total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      });
    });

    clearCashBtn.addEventListener('click', () => {
      initialCashInput.value = '0.00';
    });

    let isPasswordMode = false;
    toggleModeBtn.addEventListener('click', () => {
      isPasswordMode = !isPasswordMode;
      if (isPasswordMode) {
        pinDotsWrapper.classList.add('hidden');
        keypadGrid.classList.add('hidden');
        passwordFieldWrapper.classList.remove('hidden');
        toggleModeBtn.innerHTML = '<span class="material-symbols-outlined text-sm">dialpad</span> Usar Teclado PIN';
      } else {
        pinDotsWrapper.classList.remove('hidden');
        keypadGrid.classList.remove('hidden');
        passwordFieldWrapper.classList.add('hidden');
        toggleModeBtn.innerHTML = '<span class="material-symbols-outlined text-sm">password</span> Usar contraseña';
      }
    });

    cashierCards.forEach(card => {
      card.addEventListener('click', () => {
        cashierCards.forEach(c => {
          c.classList.remove('ring-2', 'ring-primary-container');
          c.classList.add('bg-surface-container-lowest/70');
          const badge = c.querySelector('.absolute.top-2.right-2');
          if (badge) badge.remove();
        });
        card.classList.add('ring-2', 'ring-primary-container');
        card.classList.remove('bg-surface-container-lowest/70');
        const badge = document.createElement('span');
        badge.className = 'absolute top-2 right-2 bg-primary-container text-on-primary-container rounded-full p-0.5 flex items-center justify-center';
        badge.innerHTML = '<span class="material-symbols-outlined text-sm font-bold" style="font-variation-settings: \'FILL\' 1;">check</span>';
        card.appendChild(badge);
        pin = '';
        updateDots();
      });
    });

    function triggerSuccess() {
      submitBtn.classList.remove('bg-primary-container');
      submitBtn.classList.add('bg-primary');
      submitBtn.innerHTML = `
        <div class="flex items-center gap-space-sm text-on-primary">
          <span class="material-symbols-outlined text-2xl animate-spin">sync</span>
          <span class="font-label-lg text-label-lg">Aperturando Turno...</span>
        </div>
      `;
      setTimeout(() => {
        submitBtn.innerHTML = `
          <div class="flex items-center gap-space-sm text-on-primary">
            <span class="material-symbols-outlined text-2xl">check_circle</span>
            <span class="font-label-lg text-label-lg">¡Caja Abierta con Éxito!</span>
          </div>
        `;
      }, 1200);
    }

    submitBtn.addEventListener('click', triggerSuccess);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        triggerSuccess();
      } else if (!isPasswordMode && e.key >= '0' && e.key <= '9') {
        if (pin.length < maxPinLength) {
          pin += e.key;
          updateDots();
        }
      } else if (!isPasswordMode && (e.key === 'Backspace' || e.key === 'Delete')) {
        pin = pin.slice(0, -1);
        updateDots();
      }
    });
  })();
</script></main>
